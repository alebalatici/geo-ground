
[project]
name = "geoground-backend"
version = "0.1.0"
description = "GeoGround B2B SaaS Satellite Intelligence Backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "earthengine-api>=1.4.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",

    # PostgreSQL and spatial database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.15.0",

    # AI integrations
    "google-genai>=1.0.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
