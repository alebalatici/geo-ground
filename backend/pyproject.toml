[project]
name = "geoground-backend"
version = "0.1.0"
description = "GeoGround B2B SaaS Satellite Intelligence Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "earthengine-api>=1.4.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]